<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾经 · 无法再次抵达的光</title>
<meta name="description" content="人们最容易怀念的，往往是那些无法再次拥有的东西——一篇关于记忆与"曾经"的短文。">

<style>
  :root {
    --night: #0b1018;
    --night-soft: #121927;
    --paper: #e9e1d6;
    --muted: #9d978f;
    --warm: #d7a96b;
    --warm-soft: #f1d6a6;
    --line: rgba(215,169,107,.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--night);
    color: var(--paper);
    font-family:
      "Songti SC",
      "STSong",
      "Noto Serif CJK SC",
      "Source Han Serif SC",
      Georgia,
      serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    width: 100%;
    height: min(86vh, 820px);
    min-height: 540px;
    overflow: hidden;
    background: var(--night);
  }

  .hero svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hero-fade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(11,16,24,.04) 35%, rgba(11,16,24,.18) 58%, var(--night) 100%),
      linear-gradient(to right, rgba(11,16,24,.18), transparent 55%);
    pointer-events: none;
  }

  .hero-text {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: min(720px, 88%);
    text-align: center;
    animation: rise 1.4s ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  .hero-eyebrow {
    margin-bottom: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .42em;
    color: var(--warm);
  }

  .hero-title {
    color: var(--paper);
    font-size: clamp(42px, 7vw, 68px);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: .18em;
    text-shadow: 0 3px 30px rgba(0,0,0,.55);
  }

  .hero-sub {
    margin-top: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: .16em;
    color: rgba(233,225,214,.65);
  }

  .scroll-cue {
    position: absolute;
    left: 50%;
    bottom: 28px;
    width: 1px;
    height: 34px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, var(--warm));
    opacity: .55;
  }

  main {
    width: min(680px, calc(100% - 48px));
    margin: 0 auto;
    padding: 12vh 0 14vh;
  }

  .essay p {
    margin-bottom: 2.7em;
    color: rgba(233,225,214,.86);
    font-size: clamp(17px, 2vw, 19px);
    line-height: 2.15;
    letter-spacing: .025em;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .9s ease, transform .9s ease;
  }

  .essay p.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .essay p:first-of-type::first-letter {
    color: var(--warm);
    font-size: 1.5em;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin: 3.6em 0;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .9s ease, transform .9s ease;
  }

  .divider.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .divider span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--warm);
    opacity: .4;
  }

  .divider span:nth-child(2) {
    width: 5px;
    height: 5px;
    opacity: .8;
  }

  .echo {
    margin-top: 4.8em;
    padding-top: 2.8em;
    border-top: 1px solid var(--line);
    text-align: center;
  }

  .echo-mark {
    display: block;
    width: 32px;
    height: 1px;
    margin: 0 auto 24px;
    background: linear-gradient(to right, transparent, var(--warm), transparent);
  }

  .echo p {
    margin: 0;
    color: var(--warm-soft);
    font-size: clamp(20px, 3vw, 25px);
    font-weight: 400;
    line-height: 1.9;
    letter-spacing: .05em;
  }

  footer {
    padding: 6vh 24px 9vh;
    text-align: center;
    color: rgba(157,151,143,.55);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: .18em;
  }

  footer .line {
    width: 1px;
    height: 42px;
    margin: 0 auto 20px;
    background: linear-gradient(to bottom, var(--warm), transparent);
    opacity: .45;
  }

  @media (max-width: 600px) {
    .hero {
      height: 72vh;
      min-height: 440px;
    }

    .hero-text {
      bottom: 11%;
    }

    .hero-title {
      font-size: clamp(38px, 13vw, 52px);
      letter-spacing: .14em;
    }

    .hero-sub {
      font-size: 11px;
      letter-spacing: .1em;
    }

    main {
      width: min(100% - 40px, 680px);
      padding: 9vh 0 11vh;
    }

    .essay p {
      line-height: 2;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-text {
      animation: none;
      opacity: 1;
      transform: translateX(-50%);
    }

    .essay p,
    .divider {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* If JavaScript is unavailable, the essay remains readable. */
  .js-ready .essay p,
  .js-ready .divider {
    opacity: 0;
  }

  .js-ready .essay p.visible,
  .js-ready .divider.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<section class="hero" aria-label="一个人站在岸边，望向渐渐隐没的金色光晕">
  <svg viewBox="0 0 680 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>一个人站在岸边，望向远方渐渐隐没的金色光晕</title>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a2140"/>
        <stop offset="45%" stop-color="#3a3560"/>
        <stop offset="70%" stop-color="#8a5a6a"/>
        <stop offset="100%" stop-color="#e8b06a"/>
      </linearGradient>
      <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#ffb85a" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c98a5a" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#16213a"/>
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="680" height="330" fill="url(#sky)"/>
    <circle cx="500" cy="200" r="70" fill="url(#sun)"/>
    <circle cx="500" cy="200" r="34" fill="#ffdf9e" opacity="0.9"/>

    <g opacity="0.28">
      <path d="M0 250 L90 200 L180 250 L260 210 L340 250 L680 250 L680 260 L0 260 Z" fill="#e8b06a"/>
    </g>
    <g opacity="0.4">
      <path d="M0 265 L120 220 L230 260 L360 225 L480 260 L680 240 L680 270 L0 270 Z" fill="#c98a5a"/>
    </g>
    <g opacity="0.65">
      <path d="M0 280 L150 240 L260 275 L400 245 L560 280 L680 260 L680 290 L0 290 Z" fill="#9a5a55"/>
    </g>
    <path d="M0 300 L140 260 L250 295 L390 265 L540 300 L680 285 L680 320 L0 320 Z" fill="#3a2c40"/>

    <rect x="0" y="330" width="680" height="150" fill="url(#water)"/>
    <g opacity="0.5" stroke="#e8b06a" stroke-width="1">
      <line x1="470" y1="345" x2="530" y2="345"/>
      <line x1="450" y1="360" x2="550" y2="360"/>
      <line x1="430" y1="378" x2="570" y2="378"/>
      <line x1="405" y1="398" x2="595" y2="398"/>
      <line x1="375" y1="420" x2="625" y2="420"/>
      <line x1="340" y1="445" x2="660" y2="445"/>
    </g>

    <g>
      <ellipse cx="150" cy="470" rx="180" ry="14" fill="#0d1220"/>
      <path d="M110 470 L120 430 L130 400 L145 400 L160 430 L175 470 Z" fill="#0d1220"/>
      <circle cx="140" cy="380" r="14" fill="#0d1220"/>
      <rect x="128" y="392" width="24" height="42" rx="6" fill="#0d1220"/>
    </g>

    <g opacity="0.5">
      <circle cx="40" cy="60" r="1.4" fill="#ffe9b0"/>
      <circle cx="90" cy="40" r="1" fill="#ffe9b0"/>
      <circle cx="160" cy="70" r="1.2" fill="#ffe9b0"/>
      <circle cx="220" cy="30" r="1" fill="#ffe9b0"/>
      <circle cx="60" cy="110" r="1" fill="#ffe9b0"/>
      <circle cx="270" cy="90" r="1.3" fill="#ffe9b0"/>
    </g>
  </svg>
  <div class="hero-fade"></div>
  <div class="hero-text">
    <div class="hero-eyebrow">远去的光</div>
    <h1 class="hero-title">曾经</h1>
    <div class="hero-sub">写给那些无法再次抵达的岁月</div>
  </div>
  <div class="scroll-cue" aria-hidden="true"></div>
</section>

<main>
  <div class="essay">
    <p>人们最容易怀念的，往往是那些无法再次拥有的东西。青春如此，往昔亦如此。</p>

    <div class="divider" aria-hidden="true"><span></span><span></span><span></span></div>

    <p>那些已经过去的岁月，因为无法重来，便显得格外珍贵；那些从未亲身经历过的历史，因为无法亲历，反而容易被想象得更加美好。</p>

    <div class="divider" aria-hidden="true"><span></span><span></span><span></span></div>

    <p>也许，人性中有一种奇怪的倾向：得不到的，总是显得更好；失去的，总是更值得怀念。我们真正眷恋的，或许并不是过去本身，而是那个永远无法再次抵达的“曾经”。</p>
  </div>

  <div class="echo">
    <span class="echo-mark" aria-hidden="true"></span>
    <p>我们怀念的，或许从来不是过去有多好，<br>而是那个曾经拥有过去的自己，再也回不去了。</p>
  </div>
</main>

<footer>
  <div class="line" aria-hidden="true"></div>
  <div>那个永远无法再次抵达的，曾经</div>
</footer>

<script>
  document.documentElement.classList.add('js-ready');

  const targets = document.querySelectorAll('.essay p, .divider');

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    targets.forEach(target => io.observe(target));
  } else {
    targets.forEach(target => target.classList.add('visible'));
  }
</script>

</body>
</html>
